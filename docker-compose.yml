services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER-monaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB-monaa_lisa_db}
    ports:
      # only reachable from this machine, not from the network
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monaa} -d ${POSTGRES_DB:-monaa_lisa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies the SQL migrations in db/migrations (dbmate), then exits.
  # Every other service that uses the database waits for it.
  migrate:
    image: ghcr.io/amacneil/dbmate:2
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER-monaa}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB-monaa_lisa_db}?sslmode=disable
    volumes:
      - ./db:/db:ro
    command: ["--migrations-dir", "/db/migrations", "--no-dump-schema", "--wait", "up"]

  app:
    build:
      context: .
      target: app
    image: monaa-lisa-app:latest
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER-monaa}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB-monaa_lisa_db}
      PYTHONPATH: /app/MonaaLisa/src
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      DATA_DIR: /app/data
    volumes:
      - ./MonaaLisa/src:/app/MonaaLisa/src
      - python_cache:/root/.cache/pip
      - app_data:/app/data
    command: ["/bin/sh", "-c", "python MonaaLisa/src/Database/db.py && python MonaaLisa/src/main.py"]

  backend:
    build:
      context: ./MonaaLisa/src/Backend
      target: prod
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB}
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      # Checks that the API answers on port 3000 (the slim image has no wget/curl)
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s


  frontend:
    build:
      context: ./MonaaLisa/src/Frontend
      target: prod
    restart: unless-stopped
    ports:
      - "5173:3000"
    depends_on:
      - backend
    environment:
      # The browser calls the API directly, so this must be reachable from the browser
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:3000}

  import:
    build:
      context: .
      target: app
    image: monaa-lisa-app:latest
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB}
    volumes:
      - ./MonaaLisa_dataset_full.jsonl:/app/MonaaLisa_dataset_full.jsonl:ro
      - ./import_dataset.py:/app/import_dataset.py:ro
    working_dir: /app
    profiles:
      - import
    command: ["python", "import_dataset.py", "--file", "MonaaLisa_dataset_full.jsonl", "--batch-size", "5000"]
    
volumes:
  pgdata:
  python_cache:
  app_data:
