# Please never run this docker-compose in Production! This is entirely serving as an dev environment.
# 25-06-2025 - Basti
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monaa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies the SQL migrations in db/migrations (dbmate), then exits.
  # Every other service that uses the database waits for it.
  migrate:
    image: ghcr.io/amacneil/dbmate:2
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ./db:/db:ro
    command: ["--migrations-dir", "/db/migrations", "--no-dump-schema", "--wait", "up"]

  app:
    build:
      context: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTHONPATH: /app/MonaaLisa/src
      PYTHONUNBUFFERED: 1
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      DATA_DIR: /app/data
    volumes:
      - .:/app
      - python_cache:/root/.cache/pip
      - app_data_dev:/app/data
    working_dir: /app
    command: ["/bin/sh", "-c", "cd /app/MonaaLisa/src && python Database/db.py && tail -f /dev/null"]
    ports:
      - "5000:5000"
      - "8000:8000"
    stdin_open: true
    tty: true

  backend:
    image: node:24
    working_dir: /app
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3000
    volumes:
      - ./MonaaLisa/src/Backend:/app
      - backend_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run start:dev"]
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./MonaaLisa/src/Frontend
      target: dev
    ports:
      - "5173:5173"
      - "24678:24678"
    depends_on:
      - app
      - backend
    volumes:
      - ./MonaaLisa/src/Frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:3000}
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    command: ["sh", "-c", "npm install && npx vite dev --host 0.0.0.0 --port 5173"]
    stdin_open: true
    tty: true

volumes:
  pgdata_dev:
  python_cache:
  frontend_node_modules:
  backend_node_modules:
  app_data_dev:
